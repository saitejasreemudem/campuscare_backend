databases:
  - name: campuscare-db
    databaseName: campuscare
    user: campuscare_user
    plan: free

services:
  - type: web
    name: campuscare-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: campuscare-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: campuscare-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: campuscare-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: campuscare-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: campuscare-db
          property: password
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://campuscare-frontend-three.vercel.app